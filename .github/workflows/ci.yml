name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-run review-gate when the description is cleaned after open
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    # Body/title edits only need review-gate / pr-standards; skip the matrix.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.15"]
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: ./scripts/verify.sh

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: bash scripts/e2e.sh

  identity:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutral commit identity
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_identity.py \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            # Catch push-mode squash failures before merge: build the commit
            # GitHub would write (owner author, GitHub committer, title (#N)).
            BODY_FILE="$(mktemp)"
            printf '%s' "${PR_BODY:-}" >"$BODY_FILE"
            python3 scripts/check_identity.py \
              --check-simulated-squash \
              --owner="$OWNER" \
              --pr-number="${{ github.event.pull_request.number }}" \
              --title="$PR_TITLE" \
              --author-name="$OWNER" \
              --author-email="${OWNER}@users.noreply.github.com" \
              --body-file="$BODY_FILE" \
              --tree-ish="${{ github.event.pull_request.head.sha }}" \
              --parent="${{ github.event.pull_request.base.sha }}"
            rm -f "$BODY_FILE"
          else
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            # Push: GitHub squash merges use GitHub as committer and the
            # repo owner as author. PR-range checks stay strict.
            SQUASH=(--allow-github-squash --owner="$OWNER")
            if [ "$BEFORE" = "$ZERO" ]; then
              python3 scripts/check_identity.py "${SQUASH[@]}" "${HEAD_SHA}^!"
            else
              python3 scripts/check_identity.py "${SQUASH[@]}" "${BEFORE}..${HEAD_SHA}"
            fi
          fi

  # pr-body lives in .github/workflows/pr-standards.yml (copyable with
  # scripts/check_pr_body.py). Keep cairnkit-only jobs below.

  review-gate:
    if: github.event_name == 'pull_request'
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Review section gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_review_gate.py
