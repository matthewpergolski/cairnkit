name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-run pr-body when the description is cleaned after open
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    # Body/title edits only need pr-body; skip the matrix.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.15"]
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: ./scripts/verify.sh

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: bash scripts/e2e.sh

  identity:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutral commit identity
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_identity.py \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO" ]; then
              python3 scripts/check_identity.py "${HEAD_SHA}^!"
            else
              python3 scripts/check_identity.py "${BEFORE}..${HEAD_SHA}"
            fi
          fi

  pr-body:
    if: github.event_name == 'pull_request'
    name: pr-body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PR body shape
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_body.py
